<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">ECP5Stream architecture</title>
  <desc id="d">Lattice ECP5 SoC: VexRiscv CPU, CSRs and LiteDRAM on a Wishbone bus; Etherbone master behind a register slice; UDPStreamer feeding the LiteEth UDP/IP core through register-sliced ports; RGMII PHY to an RTL8211F; DDR3L off-chip; a PC controls the board over UDP 1234 and receives the stream on UDP 6001.</desc>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
    <g id="reg"><rect x="-9" y="-4" width="7" height="8" rx="1" fill="#d97706"/><rect x="2" y="-4" width="7" height="8" rx="1" fill="#d97706"/></g>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2328">ECP5Stream</text>
  <text x="152" y="34" font-size="13" fill="#57606a">line-rate GigE UDP streaming from FPGA fabric · Yosys / nextpnr / LiteX</text>

  <!-- FPGA boundary -->
  <rect x="20" y="56" width="700" height="432" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="38" y="80" font-size="13" font-weight="700" fill="#1f2328">Lattice ECP5 LFE5U-25F</text>
  <text x="212" y="80" font-size="12" fill="#57606a">sys 50 MHz · 14.1 k LUT (58 %) · timing closed</text>

  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <!-- Row 1: CPU, CSRs, LiteDRAM -->
    <rect x="40" y="96" width="160" height="62" rx="8" fill="#fff" stroke="#57606a"/>
    <text x="120" y="118" font-weight="600">VexRiscv CPU</text>
    <text x="120" y="134" fill="#57606a" font-size="11">LiteX BIOS · memtest</text>
    <text x="120" y="149" fill="#57606a" font-size="11">UART console</text>

    <rect x="290" y="96" width="180" height="62" rx="8" fill="#fff" stroke="#57606a"/>
    <text x="380" y="118" font-weight="600">CSRs</text>
    <text x="380" y="134" fill="#57606a" font-size="11">streamer: rate, length, dest</text>
    <text x="380" y="149" fill="#57606a" font-size="11">counters: sent, stall, time</text>

    <rect x="530" y="96" width="170" height="62" rx="8" fill="#fff" stroke="#57606a"/>
    <text x="615" y="118" font-weight="600">LiteDRAM</text>
    <text x="615" y="134" fill="#57606a" font-size="11">ECP5 DDR3 PHY, 1:2</text>
    <text x="615" y="149" fill="#57606a" font-size="11">L2 cache 8 KiB</text>
  </g>

  <!-- Wishbone bus -->
  <rect x="40" y="180" width="660" height="14" rx="7" fill="#d0d7de"/>
  <text x="370" y="191" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle">Wishbone</text>
  <g stroke="#6e7781" stroke-width="1.5">
    <line x1="120" y1="158" x2="120" y2="180"/>
    <line x1="330" y1="158" x2="330" y2="180"/>
    <line x1="615" y1="158" x2="615" y2="180"/>
  </g>

  <g font-size="12" fill="#1f2328" text-anchor="middle">
    <!-- Row 2: Etherbone, UDPStreamer -->
    <rect x="40" y="228" width="160" height="58" rx="8" fill="#fff" stroke="#57606a"/>
    <text x="120" y="251" font-weight="600">Etherbone master</text>
    <text x="120" y="268" fill="#57606a" font-size="11">PC reads/writes any CSR</text>

    <rect x="290" y="228" width="180" height="58" rx="8" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/>
    <text x="380" y="251" font-weight="700" fill="#0f766e">UDPStreamer</text>
    <text x="380" y="268" fill="#1f2328" font-size="11">seq · 64-bit timestamp · pattern</text>
  </g>
  <!-- Etherbone to bus through the register slice -->
  <line x1="120" y1="228" x2="120" y2="194" stroke="#6e7781" stroke-width="1.5"/>
  <use href="#reg" x="120" y="212"/>
  <text x="134" y="216" font-size="10" fill="#9a6700">slice</text>
  <!-- CSR control into the streamer -->
  <path d="M430 158V228" stroke="#6e7781" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ac)"/>

  <!-- Row 3: LiteEth core -->
  <rect x="40" y="322" width="480" height="96" rx="8" fill="#fff" stroke="#57606a"/>
  <text x="280" y="372" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">LiteEth UDP/IP core · 32-bit in sys</text>
  <text x="280" y="390" font-size="11" fill="#57606a" text-anchor="middle">UDP crossbar · IPv4 · ARP · ICMP (pipelined) · MAC + CRC</text>
  <text x="280" y="406" font-size="11" fill="#57606a" text-anchor="middle">async FIFO to the 125 MHz PHY clock</text>
  <!-- ports with register stages -->
  <line x1="120" y1="286" x2="120" y2="322" stroke="#6e7781" stroke-width="1.5" marker-start="url(#ac)" marker-end="url(#ac)"/>
  <use href="#reg" x="120" y="304"/>
  <text x="134" y="340" font-size="10" fill="#57606a">UDP 1234</text>
  <line x1="380" y1="286" x2="380" y2="322" stroke="#0f766e" stroke-width="3" marker-end="url(#ad)"/>
  <use href="#reg" x="380" y="304"/>
  <text x="394" y="340" font-size="10" fill="#0f766e">UDP 6000</text>

  <!-- RGMII PHY -->
  <rect x="560" y="322" width="140" height="96" rx="8" fill="#fff" stroke="#57606a"/>
  <text x="630" y="360" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">RGMII PHY</text>
  <text x="630" y="377" font-size="11" fill="#57606a" text-anchor="middle">ECP5 DDR I/O</text>
  <text x="630" y="393" font-size="11" fill="#57606a" text-anchor="middle">eth_rx 125 MHz</text>
  <line x1="520" y1="362" x2="560" y2="362" stroke="#0f766e" stroke-width="3" marker-end="url(#ad)"/>
  <line x1="560" y1="384" x2="520" y2="384" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- Legend -->
  <g font-size="11" fill="#57606a">
    <line x1="44" y1="458" x2="84" y2="458" stroke="#0f766e" stroke-width="3" marker-end="url(#ad)"/>
    <text x="92" y="462">stream data (no CPU in the path)</text>
    <line x1="290" y1="458" x2="330" y2="458" stroke="#6e7781" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ac)"/>
    <text x="338" y="462">control</text>
    <use href="#reg" x="420" y="458"/>
    <text x="436" y="462">register stage added for timing closure</text>
  </g>

  <!-- Off-chip -->
  <text x="752" y="80" font-size="12" font-weight="700" fill="#57606a">on the board</text>
  <rect x="750" y="96" width="190" height="62" rx="8" fill="#fff" stroke="#57606a"/>
  <text x="845" y="120" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">DDR3L x16</text>
  <text x="845" y="138" font-size="11" fill="#57606a" text-anchor="middle">MT41K128M16 · 100 MHz</text>
  <line x1="700" y1="127" x2="750" y2="127" stroke="#6e7781" stroke-width="1.5" marker-start="url(#ac)" marker-end="url(#ac)"/>

  <rect x="750" y="332" width="190" height="62" rx="8" fill="#fff" stroke="#57606a"/>
  <text x="845" y="358" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">RTL8211F</text>
  <text x="845" y="376" font-size="11" fill="#57606a" text-anchor="middle">gigabit PHY · RGMII-ID</text>
  <line x1="700" y1="362" x2="750" y2="362" stroke="#0f766e" stroke-width="3" marker-end="url(#ad)"/>
  <line x1="750" y1="384" x2="700" y2="384" stroke="#6e7781" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- PC -->
  <line x1="845" y1="394" x2="845" y2="440" stroke="#0f766e" stroke-width="3" marker-end="url(#ad)"/>
  <text x="857" y="422" font-size="10" fill="#57606a">1000BASE-T</text>
  <rect x="750" y="440" width="190" height="96" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="845" y="463" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">PC · host/ecp5stream.py</text>
  <text x="845" y="482" font-size="11" fill="#57606a" text-anchor="middle">UDP 1234: control (Etherbone)</text>
  <text x="845" y="498" font-size="11" fill="#0f766e" text-anchor="middle">UDP 6001: receive + verify</text>
  <text x="845" y="514" font-size="11" fill="#57606a" text-anchor="middle">loss · rate · timing → JSON</text>
</svg>
